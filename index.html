<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinh nhật em Ánh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas cho Three.js -->
    <canvas id="threeCanvas"></canvas>
    
    <!-- Fireworks 2D Overlay -->
    <div class="fireworks-overlay" id="fireworksOverlay">
        <canvas id="fireworksCanvas"></canvas>
        <div class="birthday-message" id="birthdayMessage">
            Chúc mừng sinh nhật em iu nhé. ❤️❤️❤️❤️
        </div>
    </div>
    
    <!-- UI Overlay -->
    <div class="ui-overlay">
        <!-- Modal để hiển thị ảnh zoom -->
        <div class="modal" id="imageModal">
            <div class="modal-content">
                <span class="close" id="closeModal">&times;</span>
                <img id="modalImage" src="" alt="">
                <div class="image-info">
                    <h3 id="imageName"></h3>
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <button id="zoomIn">+</button>
            <button id="zoomOut">-</button>
            <button id="reset">Reset</button>
            <button id="rotateLeft">↶</button>
            <button id="rotateRight">↷</button>
            <button id="rotateUp">↑</button>
            <button id="rotateDown">↓</button>
            <button id="autoRotate">🔄</button>
            <button id="turbulence">🌪️</button>
        </div>
        
        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="loading-text">...</div>
        </div>
